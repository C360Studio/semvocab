# Files markdownlint-cli2 must not lint: dependencies, Enjoy's git-ignored local process logs, the
# OpenSpec-generated current specs, and vendored third-party files.
# openspec/specs/** is rewritten by `openspec archive` with its own formatting (no blank lines around
# headings); its content is validated by `task spec:check`. Human-written openspec/changes/** stays linted.
ignores:
  - node_modules/**
  - "**/node_modules/**"
  - .enjoy-logs/**
  - openspec/specs/**
  # Vendored fixtures are copied unmodified and pinned by sha256 in docs/admission-ledger.yaml; linting
  # would require editing them.
  - internal/oracle/testdata/**
