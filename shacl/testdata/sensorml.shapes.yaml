        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://purl.org/dc/terms/identifier"
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://purl.org/dc/terms/title"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        min_count: 1
        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://purl.org/dc/terms/description"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://www.opengis.net/spec/sensorML/3.0/definition"
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://www.opengis.net/spec/sensorML/3.0/baseProperty"
        min_count: 1
        max_count: 1
        pattern: '^[^ \t\n\r]+$'

  - id: "http://www.opengis.net/spec/sensorML/3.0/PhysicalSystemShape"
    target_classes: ["http://www.opengis.net/spec/sensorML/3.0/PhysicalSystem"]
