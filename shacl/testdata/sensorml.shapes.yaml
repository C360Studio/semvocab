      - path: "http://purl.org/dc/terms/identifier"
        min_count: 1
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://purl.org/dc/terms/title"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        min_count: 1
        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://purl.org/dc/terms/description"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
