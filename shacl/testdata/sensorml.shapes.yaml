        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://www.w3.org/2000/01/rdf-schema#isDefinedBy"
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://www.w3.org/ns/sosa/hosts"
        min_count: 0
      - path: "http://www.w3.org/ns/sosa/isHostedBy"
        min_count: 0
      - path: "http://www.w3.org/ns/ssn/hasSubSystem"
        min_count: 0
      - path: "http://www.w3.org/ns/sosa/usedProcedure"
