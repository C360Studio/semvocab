# The SensorML shapes of packs/sensorml/sensorml.shacl.ttl in SemVocab's YAML
# shape form, written by hand from the Turtle for multi-format compilation parity.
node_shapes:
  - id: "http://www.opengis.net/spec/sensorML/3.0/DeploymentShape"
    target_classes: ["http://www.opengis.net/spec/sensorML/3.0/Deployment"]
    properties:
      - path: "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
        min_count: 1
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://purl.org/dc/terms/identifier"
        min_count: 1
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://purl.org/dc/terms/title"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        min_count: 1
        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://purl.org/dc/terms/description"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        max_count: 1
        pattern: '(.|[\n\r])+'
      - path: "http://www.w3.org/2000/01/rdf-schema#isDefinedBy"
        max_count: 1
        pattern: '^[^ \t\n\r]+$'
      - path: "http://www.opengis.net/spec/sensorML/3.0/position"
        datatype: "http://www.w3.org/1999/02/22-rdf-syntax-ns#JSON"
        max_count: 1
      - path: "http://www.w3.org/2004/02/skos/core#notation"
        min_count: 0
      - path: "http://www.w3.org/ns/ssn/systems/hasSystemCapability"
        min_count: 0
      - path: "http://www.w3.org/ns/ssn/hasProperty"
        min_count: 0
      - path: "http://www.w3.org/ns/ssn/deployedSystem"
        min_count: 0
        pattern: '^[^ \t\n\r]+$'
      - path: "http://www.w3.org/2004/02/skos/core#broader"
        max_count: 1

  - id: "http://www.opengis.net/spec/sensorML/3.0/DerivedPropertyShape"
    target_classes: ["http://www.opengis.net/spec/sensorML/3.0/DerivedProperty"]
    properties:
      - path: "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
