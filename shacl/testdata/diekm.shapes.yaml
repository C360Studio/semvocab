# The DIEKM shapes of packs/diekm/diekm.shacl.ttl in SemVocab's YAML shape
# form, written by hand from the Turtle (task 4.3 compares the two).
node_shapes:
  - id: "https://w3id.org/c360/diekm#IntelligenceObservationShape"
    target_classes: ["https://w3id.org/c360/diekm#IntelligenceObservation"]
  - id: "https://w3id.org/c360/diekm#IntelligencePlatformShape"
    target_classes: ["https://w3id.org/c360/diekm#IntelligencePlatform"]
    properties:
      - path: "https://w3id.org/c360/diekm#altitudeMeters"
        datatype: "http://www.w3.org/2001/XMLSchema#double"
        max_count: 1
      - path: "https://w3id.org/c360/diekm#assignedRole"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
