# SemVocab admission ledger (issue #1, Phase 0; issue #26, Phase 0).
# One entry per candidate catalog or pack. Every admitted term names a source at an exact revision.
# Field meanings are in `fields:` below; disposition values are in `dispositions:`.
schema_version: 1

fields:
  disposition: one value from `dispositions`
  semengine_overlap: SemEngine symbols at the pin, as file:line; empty when none
  source: where admitted terms come from (pinned SemStreams path+symbols, external ontology release, or external schema bundle)
  admitted_terms: the exact terms admitted; nothing outside this list may be added without a ledger change
  excluded_source_symbols: source symbols deliberately not admitted, each with a reason
  namespace: honesty declaration for C360-local pack IRIs or C360 RDF IRI conventions over non-RDF specification base URIs
  license: license and attribution obligation of the source
  test_oracle: the independent fixture the tests compare against
  deferral_reason: why a deferred entry is deferred (required when disposition is deferred)
  phase: the issue phase that delivers the entry

dispositions:
  use-semengine-symbol: consumers use SemEngine's exported symbol directly; SemVocab adds no API
  thin-reexport: SemVocab references SemEngine's symbol (no copied IRI string), with equality tests
  new-content: terms absent from SemEngine and SemStreams, from a named external release
  port: carried from the SemStreams pin, restricted to terms verified in the named release
  extraction: carried from shared SemStreams files (standards.go, iris.go), restricted likewise
  deferred: not delivered in Phases 0-3; reason recorded

pins:
  semstreams:
    repository: https://github.com/C360Studio/semstreams
    revision: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
    license: MIT, Copyright (c) 2025 C360 (LICENSE at revision)
  semengine:
