    referenced_terms_verified: [cco:ont00000713, cco:ont00000995, cco:ont00000037, cco:ont00000228, cco:ont00000005,
      cco:ont00000787, cco:ont00001904, cco:ont00001163, cco:ont00000253, obo:BFO_0000001, obo:BFO_0000002,
      obo:BFO_0000003, obo:BFO_0000004, obo:BFO_0000015, obo:BFO_0000023, obo:BFO_0000030, obo:BFO_0000040,
      obo:BFO_0000084, obo:BFO_0000196, rdfs:label]
    admitted_terms: >-
      diekm:IntelligencePlatform, diekm:IntelligenceObservation, diekm:altitudeMeters, diekm:assignedRole,
      diekm:altitudeMetersValue (datatype property, domain cco:ont00000253, range xsd:decimal)
    local_assertions:
      - >-
        diekm:IntelligencePlatform rdfs:subClassOf obo:BFO_0000030 (owner ruling Q2; not entailed by CCO, where
        Vehicle ⊑ Material Artifact ⊑ BFO_0000040)
    rulings:
      Q1: CCO v2 (pinned v2.2)
      Q2: keep BFO_0000030 as a DIEKM-local assertion
      Q3: "diekm:assignedRole projected via BFO_0000196 (bearer of) → BFO_0000023 (role); RO_0000053 → BFO_0000196"
      Q4: "Information Bearing Entity hop via BFO_0000084 (generically depends on) → cco:ont00000253"
      Q4b: "altitude terminal value predicate is diekm:altitudeMetersValue on the Information Bearing Entity, not the deprecated cco:ont00001769"
      Q5: namespace stays local and unregistered
      Q23: "diekm.mapping.yaml: intel.platform contract with groups measurement and role, both reconcile, no birth predicates"
    license: "MIT (SemVocab), Copyright (c) 2026 Complete 360 Studio"
    test_oracle: >-
      superclass sets equal the cco-2.2 asserted closure plus the recorded local assertion and its closure; every IRI
      declared in cco-2.2 (or diekm/rdfs); the pack loads and registers through SemEngine v0.1.0-alpha.2

